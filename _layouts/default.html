<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en' }}" data-theme="dark">
<!-- Based on https://github.com/luost26/academic-homepage -->
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <title>{% if page.title and page.title != site.data.profile.primary_name %}{{ page.title }} · {% endif %}{{ site.data.profile.primary_name }}</title>
    <meta name="description" content="{{ page.description | default: site.description | strip_newlines | escape }}">
    <meta name="author" content="{{ site.data.profile.primary_name }}">
    <meta name="theme-color" content="#070b10">

    <meta property="og:type" content="website">
    <meta property="og:site_name" content="{{ site.data.profile.primary_name }}">
    <meta property="og:title" content="{% if page.title %}{{ page.title }} · {% endif %}{{ site.data.profile.primary_name }}">
    <meta property="og:description" content="{{ page.description | default: site.description | strip_newlines | escape }}">
    <meta property="og:url" content="{{ page.url | absolute_url }}">
    <meta property="og:image" content="{{ '/assets/images/og-card-v2.jpg' | absolute_url }}">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="{{ '/assets/images/og-card-v2.jpg' | absolute_url }}">
    <link rel="canonical" href="{{ page.url | absolute_url }}">

    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Ziwei Song",
        "url": "{{ '/' | absolute_url }}",
        "image": "{{ '/assets/images/photos/avatar-v2.webp' | absolute_url }}",
        "jobTitle": "Ph.D. Student",
        "affiliation": {
            "@type": "CollegeOrUniversity",
            "name": "City University of Hong Kong"
        },
        "sameAs": [
            "https://github.com/{{ site.data.profile.github }}"
        ],
        "knowsAbout": [
            "Real-Time Systems",
            "Autonomous Driving",
            "Edge Intelligence",
            "Internet of Things"
        ]
    }
    </script>

    <link rel="icon" href="{{ '/assets/images/favicon.svg' | relative_url }}" type="image/svg+xml">

    <!-- Stylesheets -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/4.6.0/css/bootstrap.min.css" integrity="sha512-P5MgMn1jBN01asBgU0z60Qk4QxiXo86+wlFahKrsQf37c9cro517WzVSPPV1tDKzhku2iJ2FVgL67wG03SGnNA==" crossorigin="anonymous" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/academicons/1.9.1/css/academicons.min.css" integrity="sha512-b1ASx0WHgVFL5ZQhTgiPWX+68KjS38Jk87jg7pe+qC7q9YkEtFq0z7xCglv7qGIs/68d3mAp+StfC8WKC5SSAg==" crossorigin="anonymous" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ '/assets/css/global.css' | relative_url }}">
    {% if page.show_deadline_drive %}
    <link rel="stylesheet" href="{{ '/assets/css/deadline-drive.css' | relative_url }}">
    {% endif %}
</head>
<body class="bg-light d-flex flex-column min-vh-100" {{ page.body_attr }}>
    {% include navbar.html %}
    <main class="flex-grow-1 flex-shrink-0 {% if page.container_class %}{{ page.container_class }}{% else %}container-lg{% endif %}">
        {{ content }}
    </main>
    {% include footer.html %}

    <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery.lazy/1.7.9/jquery.lazy.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js" integrity="sha384-UO2eT0CpHqdSJQ6hJty5KVphtPhzWj9WO1clHTMGa3JDZwrnQq4sF86dIHNDz0W1" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/4.6.0/js/bootstrap.min.js" integrity="sha512-XKa9Hemdy1Ui3KSGgJdgMyYlUg1gM+QhL6cnlyTe2qzMCYm4nAZ1PsVerQzTTXzonUR+dmswHqgJPuwCq1MaAg==" crossorigin="anonymous"></script>
    <script src="{{ '/assets/js/bubble_visual_hash.js' | relative_url }}"></script>
    <script src="{{ '/assets/js/common.js' | relative_url }}"></script>
    <script src="{{ '/assets/js/site.js' | relative_url }}"></script>
    {% if page.show_deadline_drive %}
    <script src="{{ '/assets/js/deadline-drive.js' | relative_url }}"></script>
    {% endif %}
</body>
</html>
