{% assign profile = site.data.profile %}
<div class="row mt-3">
    <div class="col">
        <div class="card bio-card">
            <div class="card-body">
                <h2 class="card-title-main">About Me</h2>
                <div class="text-profile-bio" {% if profile.short_bio_text_justify %}style="text-align: justify;"{% endif %}>
                    {{ profile.short_bio }}
                </div>

                {% if profile.research_interests %}
                <div class="interest-tags" aria-label="Research interests">
                    {% for topic in profile.research_interests %}
                    <span class="interest-tag">{{ topic }}</span>
                    {% endfor %}
                </div>
                {% endif %}

                {% if profile.cv_link %}
                <a class="cv-inline-link" href="{{ profile.cv_link | relative_url }}">
                    <i class="fas fa-file-lines" aria-hidden="true"></i> Full CV
                </a>
                {% endif %}
            </div>
        </div>
    </div>
</div>
