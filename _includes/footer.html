<footer class="footer flex-shrink-0 mt-5">
    <div class="{% if page.container_class %}{{ page.container_class }}{% else %}container-lg{% endif %}">
        <div class="row py-4 align-items-center">
            <div class="col-md-6">
                <div class="footer-meta">
                    © {{ "now" | date: "%Y" }} {{ site.data.profile.primary_name }}
                    <span class="footer-sep" aria-hidden="true">/</span>
                    <span>Last updated {{ "now" | date: "%b %Y" }}</span>
                </div>
            </div>
            <div class="col-md-6">
                <div class="footer-meta text-md-right">
                    {{ site.data.display.footer_text }}
                </div>
            </div>
        </div>
    </div>
</footer>
