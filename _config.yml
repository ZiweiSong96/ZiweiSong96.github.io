# Site settings
title: "Ziwei Song"
name: "Ziwei Song"
description: >-
  Ziwei Song is a Ph.D. student in Computer Science at City University of Hong
  Kong, working on real-time AI systems, autonomous driving, and
  mixture-of-experts inference.
url: "https://ziweisong96.github.io"
baseurl: ""
lang: en
timezone: Asia/Hong_Kong

# Build settings
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true

plugins:
  - jekyll-sitemap
  - jekyll-redirect-from

collections:
  publications:
    output: false
  news:
    output: false

# Files and folders that should not be published
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - node_modules
  - vendor
  - .bundle
  - .jekyll-cache
  - "*.log"
