short_bio: >-
  <p>
    I am a 4th-year Ph.D. student in the <a href="https://www.cs.cityu.edu.hk/" target="_blank">Department of Computer Science</a>
    at <a href="https://www.cityu.edu.hk/" target="_blank">City University of Hong Kong</a>, advised by
    <a href="https://www.cs.cityu.edu.hk/~nanguan/" target="_blank">Prof. Nan Guan</a>, and a member of
    <a href="https://mlab.hk/" target="_blank">CityU MLab</a>. My research sits at the intersection of real-time
    systems and AI: making large-model inference — especially mixture-of-experts — predictable under tight
    memory and latency budgets, and building autonomous driving systems that can be reconfigured on the fly.
    More recently, I have been exploring real-time scheduling of LLM agents and LLM agents for OS-kernel
    formal verification. I have also worked on real-time task execution in ROS 2 robotic systems.
  </p>
  <p>
    Prior to my Ph.D., I received my B.S. and M.S. degrees in Software Engineering from the
    <a href="https://www.uestc.edu.cn/" target="_blank">University of Electronic Science and Technology of China</a>
    in 2019 and 2022.
  </p>

