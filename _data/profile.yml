short_bio: >-
  <p>
    I am a Ph.D. student in the <a href="https://www.cs.cityu.edu.hk/" target="_blank">Department of Computer Science</a>
    at <a href="https://www.cityu.edu.hk/" target="_blank">City University of Hong Kong</a>, advised by
    <a href="https://www.cs.cityu.edu.hk/~nanguan/" target="_blank">Prof. Nan Guan</a>. My research lies in
    real-time systems, autonomous driving systems, and real-time intelligence on edge and embedded devices.
  </p>
  <p>
    Prior to my Ph.D., I received my B.S. and M.S. degrees in Software Engineering from the
    <a href="https://www.uestc.edu.cn/" target="_blank">University of Electronic Science and Technology of China</a>
    in 2019 and 2022.
  </p>

